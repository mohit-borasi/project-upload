name: work

on: push

jobs:
   useracceptance:
     runs-on: ubuntu-latest
     steps:
       - name:  code download
         uses: actions/checkout@v4

       - name: check file exist 
         uses:  test -f App.jsx


   check_preference:
     runs-on: ubuntu-latest
     needs:  [useracceptance]
     steps:
       - name: download
         uses: actions/checkout@v4

       - name: set up node enviroment
         uses:  actions/setup-node@v4
         with:
           node-version: 24
           cache: npm

       - name: check code 
         run:  node --check App.jsx

